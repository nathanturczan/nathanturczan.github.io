<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Illustrative recreation: strategy modal over dimmed dashboard. Backtest figures fictional. -->
  <rect width="390" height="800" fill="#0f1419" rx="24"/>

  <!-- dimmed dashboard hints behind -->
  <g opacity="0.25">
    <text x="52" y="44" fill="#ffffff" font-size="19" font-weight="700">HMR EOD Scanner</text>
    <rect x="20" y="98" width="350" height="66" rx="10" fill="rgba(29,155,240,0.10)" stroke="#1d9bf0"/>
    <rect x="20" y="176" width="350" height="46" rx="8" fill="#1a1f25" stroke="#2f3336"/>
    <rect x="20" y="272" width="350" height="106" rx="8" fill="#1a1f25" stroke="#2f3336"/>
  </g>
  <rect width="390" height="800" fill="rgba(0,0,0,0.6)" rx="24"/>

  <!-- Modal -->
  <rect x="20" y="112" width="350" height="576" rx="16" fill="#1a1f25" stroke="#2f3336"/>
  <text x="40" y="150" fill="#e7e9ea" font-size="18" font-weight="700">Double Seven</text>
  <text x="352" y="150" fill="#71767b" font-size="22" text-anchor="end">×</text>
  <line x1="20" y1="168" x2="370" y2="168" stroke="#2f3336"/>

  <text x="40" y="196" fill="#71767b" font-size="11" letter-spacing="0.5">DESCRIPTION</text>
  <text x="40" y="216" fill="#e7e9ea" font-size="13.5">Mean reversion on 7-day price extremes,</text>
  <text x="40" y="234" fill="#e7e9ea" font-size="13.5">from Connors and Alvarez's published rules.</text>

  <text x="40" y="266" fill="#71767b" font-size="11" letter-spacing="0.5">ENTRY CONDITIONS</text>
  <text x="40" y="286" fill="#e7e9ea" font-size="13.5">Close at a 7-day low, above the 200-day MA</text>

  <text x="40" y="318" fill="#71767b" font-size="11" letter-spacing="0.5">EXIT CONDITIONS</text>
  <text x="40" y="338" fill="#e7e9ea" font-size="13.5">Close at a 7-day high</text>

  <text x="40" y="374" fill="#71767b" font-size="11" letter-spacing="0.5">BACKTEST RESULTS</text>
  <!-- 2x2 stat grid -->
  <rect x="40" y="386" width="150" height="64" rx="8" fill="#0f1419"/>
  <text x="115" y="416" fill="#e7e9ea" font-size="19" font-weight="700" text-anchor="middle">214</text>
  <text x="115" y="436" fill="#71767b" font-size="10" text-anchor="middle" letter-spacing="0.5">TRADES</text>
  <rect x="200" y="386" width="150" height="64" rx="8" fill="#0f1419"/>
  <text x="275" y="416" fill="#00ba7c" font-size="19" font-weight="700" text-anchor="middle">71%</text>
  <text x="275" y="436" fill="#71767b" font-size="10" text-anchor="middle" letter-spacing="0.5">WIN RATE</text>
  <rect x="40" y="458" width="150" height="64" rx="8" fill="#0f1419"/>
  <text x="115" y="488" fill="#00ba7c" font-size="19" font-weight="700" text-anchor="middle">+$1.84</text>
  <text x="115" y="508" fill="#71767b" font-size="10" text-anchor="middle" letter-spacing="0.5">PROFIT / SHARE</text>
  <rect x="200" y="458" width="150" height="64" rx="8" fill="#0f1419"/>
  <text x="275" y="488" fill="#e7e9ea" font-size="19" font-weight="700" text-anchor="middle">4.2 days</text>
  <text x="275" y="508" fill="#71767b" font-size="10" text-anchor="middle" letter-spacing="0.5">AVG HOLD</text>
  <text x="40" y="544" fill="#71767b" font-size="11.5" font-style="italic">15 years (Jan 2011 – Jan 2026). Figures on this</text>
  <text x="40" y="560" fill="#71767b" font-size="11.5" font-style="italic">mockup are fictional.</text>

  <text x="40" y="594" fill="#71767b" font-size="11" letter-spacing="0.5">APPLICABLE TICKERS</text>
  <rect x="40" y="604" width="44" height="20" rx="4" fill="#1d9bf0"/>
  <text x="62" y="618" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">SPY</text>

  <text x="40" y="652" fill="#71767b" font-size="11" letter-spacing="0.5">SOURCE</text>
  <text x="40" y="670" fill="#1d9bf0" font-size="12">Connors / TradingMarkets · TradeStation backtest</text>
</svg>
