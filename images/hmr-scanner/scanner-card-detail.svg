<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Enlarged, annotated recreation of a single signal card. All figures fictional. -->
  <rect width="500" height="420" fill="#0f1419"/>

  <!-- Annotations above -->
  <g fill="#71767b" font-size="14">
    <text x="24" y="34">Direction: edge bar,</text>
    <text x="24" y="52">green buy / red sell</text>
    <line x1="42" y1="62" x2="42" y2="130" stroke="#536471" stroke-dasharray="3 3"/>
    <text x="286" y="34">Close price and direction</text>
    <text x="286" y="52">hold the right edge</text>
    <line x1="440" y1="62" x2="440" y2="140" stroke="#536471" stroke-dasharray="3 3"/>
  </g>

  <!-- Card -->
  <rect x="20" y="118" width="460" height="150" rx="10" fill="#1a1f25" stroke="#2f3336"/>
  <rect x="36" y="134" width="6" height="118" rx="3" fill="#00ba7c"/>
  <text x="64" y="172" fill="#e7e9ea" font-size="26" font-weight="700">QQQ</text>
  <text x="464" y="168" fill="#e7e9ea" font-size="20" font-weight="600" text-anchor="end">$431.08</text>
  <text x="464" y="190" fill="#00ba7c" font-size="13" font-weight="600" text-anchor="end">BUY</text>
  <rect x="64" y="192" width="104" height="28" rx="6" fill="#2f3336"/>
  <text x="116" y="211" fill="#e7e9ea" font-size="14" text-anchor="middle">5-Day RSI</text>
  <rect x="64" y="228" width="92" height="26" rx="6" fill="rgba(29,155,240,0.2)" stroke="#1d9bf0"/>
  <text x="110" y="246" fill="#1d9bf0" font-size="12.5" font-weight="600" text-anchor="middle">HOLDING</text>
  <rect x="164" y="228" width="168" height="26" rx="6" fill="rgba(255,165,0,0.2)" stroke="#ffa500"/>
  <text x="248" y="246" fill="#ffa500" font-size="12.5" font-weight="600" text-anchor="middle">PAPER — UNVERIFIED</text>

  <!-- Annotations below -->
  <g fill="#71767b" font-size="14">
    <line x1="110" y1="258" x2="110" y2="300" stroke="#536471" stroke-dasharray="3 3"/>
    <text x="24" y="322">Lifecycle: one of</text>
    <text x="24" y="340">four position states</text>
    <line x1="278" y1="258" x2="278" y2="300" stroke="#536471" stroke-dasharray="3 3"/>
    <text x="196" y="322">Trust: paper-ledger label,</text>
    <text x="196" y="340">shown until rules pass verification</text>
    <text x="24" y="390">The strategy chip opens the backtest record,</text>
    <text x="24" y="408">its test period, and its parity warning</text>
  </g>
</svg>
