<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Enlarged, annotated recreation of a single signal card. All figures fictional. -->
  <rect width="800" height="400" fill="#0f1419"/>

  <!-- Annotations above -->
  <g fill="#71767b" font-size="13">
    <text x="52" y="66">Direction: edge bar,</text>
    <text x="52" y="82">green buy / red sell</text>
    <line x1="86" y1="92" x2="86" y2="146" stroke="#536471" stroke-dasharray="3 3"/>
    <text x="300" y="66">Lifecycle: one of</text>
    <text x="300" y="82">four position states</text>
    <line x1="384" y1="92" x2="384" y2="160" stroke="#536471" stroke-dasharray="3 3"/>
    <text x="500" y="66">Trust: paper-ledger label, shown</text>
    <text x="500" y="82">until rules pass verification</text>
    <line x1="556" y1="92" x2="556" y2="160" stroke="#536471" stroke-dasharray="3 3"/>
  </g>

  <!-- Card -->
  <rect x="60" y="150" width="680" height="120" rx="10" fill="#1a1f25" stroke="#2f3336"/>
  <rect x="80" y="166" width="6" height="88" rx="3" fill="#00ba7c"/>
  <text x="110" y="200" fill="#e7e9ea" font-size="28" font-weight="700">QQQ</text>
  <rect x="192" y="166" width="126" height="30" rx="6" fill="#2f3336"/>
  <text x="255" y="187" fill="#e7e9ea" font-size="16" text-anchor="middle">5-Day RSI</text>
  <rect x="330" y="166" width="108" height="30" rx="6" fill="rgba(29,155,240,0.2)" stroke="#1d9bf0"/>
  <text x="384" y="186" fill="#1d9bf0" font-size="14" font-weight="600" text-anchor="middle">HOLDING</text>
  <rect x="450" y="166" width="212" height="30" rx="6" fill="rgba(255,165,0,0.2)" stroke="#ffa500"/>
  <text x="556" y="186" fill="#ffa500" font-size="14" font-weight="600" text-anchor="middle">PAPER — UNVERIFIED</text>
  <text x="110" y="240" fill="#71767b" font-size="16">Paper position opened 3 sessions ago</text>
  <text x="716" y="226" fill="#e7e9ea" font-size="24" font-weight="600" text-anchor="end">$431.08</text>
  <text x="716" y="250" fill="#00ba7c" font-size="14" font-weight="600" text-anchor="end">BUY</text>

  <!-- Annotations below -->
  <g fill="#71767b" font-size="13">
    <line x1="255" y1="200" x2="255" y2="308" stroke="#536471" stroke-dasharray="3 3"/>
    <text x="110" y="330">The strategy chip opens the backtest record,</text>
    <text x="110" y="346">its test period, and the parity warning</text>
    <line x1="690" y1="258" x2="690" y2="308" stroke="#536471" stroke-dasharray="3 3"/>
    <text x="560" y="330">Close price and direction</text>
    <text x="560" y="346">hold the right edge</text>
  </g>
</svg>
