  <rect x="60" y="386" width="680" height="38" rx="8" fill="rgba(255,165,0,0.12)" stroke="#ffa500"/>
  <text x="76" y="410" fill="#ffa500" font-size="14">Estimated view: recomputed from historical data, not the original record.</text>
